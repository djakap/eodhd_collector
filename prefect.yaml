# Prefect deployment configuration (self-hosted, no cloud)
# Docs: https://docs.prefect.io/latest/deploy/infrastructure-concepts/prefect-yaml/

name: eodhd-collector
prefect-version: ">=3.0.0"

# -----------------------------------------------------------------------
# Pull step — use local code (no remote storage needed)
# -----------------------------------------------------------------------
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

# -----------------------------------------------------------------------
# Deployments
# -----------------------------------------------------------------------
deployments:
  # Full re-collection (all 651 stocks from scratch — use occasionally)
  - name: daily-full
    entrypoint: flows/daily_collection_flow.py:daily_collection_flow
    description: "Full re-collection — all Syariah stocks from scratch (run manually or weekly)"
    work_pool:
      name: default-agent-pool
    parameters:
      stocks_file: config/syariah_stocks.txt
      collect_price: true
      collect_actions: true
      intraday_days: 120
      skip_intraday: false
      skip_validation: true
      update_mode: false
      skip_duplicate_check: false
    schedules:
      # Optional: full re-collection every Sunday at 10:00 WIB
      - cron: "0 3 * * 0"
        timezone: "Asia/Jakarta"
        active: false  # enable if you want weekly full refresh

  # Daily incremental update — fetches only missing data since last run
  # Example: if last data is Feb 2 and today is Feb 5, fetches Feb 3-5
  - name: daily-update
    entrypoint: flows/daily_collection_flow.py:update_collection_flow
    description: "Daily incremental update — fetch missing data for all 651 stocks"
    work_pool:
      name: default-agent-pool
    # On a laptop that is sometimes off: when it wakes, run ONE catch-up run and
    # auto-cancel the piled-up late runs instead of executing them all. The flow
    # is incremental (update_mode), so a single run catches everything up.
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
      update_window: 7       # re-fetch last 7 days to catch corrections/adjustments
      skip_intraday: false   # also update intraday data
    schedules:
      # Intraday is DELAYED — EODHD publishes the day's intraday only AFTER close
      # (verified: available by ~19:15 WIB). Daytime sweeps just re-fetch stale data,
      # so ONE evening sweep is enough. 19:30 WIB weekday.
      # DISABLED 2026-07-24: cutover to yfinance. This flow collects from EODHD
      # into eodhd_stock_data (legacy). yfinance-price-update (21:30) is now the
      # sole price collector, writing to stock_data.
      - cron: "30 19 * * 1-5"
        timezone: "Asia/Jakarta"
        active: false

  # Weekly QuestDB local backup — gated by a deep integrity check, and the archive
  # is read back before old backups are rotated out.
  # ACTIVE: as EODHD is wound down, this archive becomes the only copy of the
  # pre-2005 history (321,259 rows across 175 symbols) that yfinance cannot re-serve.
  - name: questdb-backup
    entrypoint: flows/backup_flow.py:questdb_backup_flow
    description: "Weekly QuestDB backup — integrity-gated, archive verified, manifest written"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      keep_local_backups: 3
      deep_check: true
    schedules:
      - cron: "30 16 * * 0"   # weekly every Sunday at 16:30 WIB
        timezone: "Asia/Jakarta"
        active: true

  # Daily gap check & auto-fill — safety net after market close
  - name: gap-check
    entrypoint: flows/daily_collection_flow.py:gap_check_flow
    description: "Daily safety net: detect missing EOD data vs expected trading day, fill gaps automatically"
    work_pool:
      name: default-agent-pool
    # Same as daily-update: avoid piled-up late runs when the laptop wakes.
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
      max_gap_days: 1       # flag stale if > 1 day behind expected
      lookback_days: 7      # re-fetch last 7 days when filling
      skip_intraday: false  # also fill intraday gaps
    schedules:
      # DISABLED 2026-07-24: cutover to yfinance. gap-check pulls from EODHD.
      # yfinance's update_flow self-heals gaps of any length via its lookback
      # anchored to each symbol's last stored bar, so a separate gap-check is
      # no longer needed.
      - cron: "0 20 * * 1-5"
        timezone: "Asia/Jakarta"
        active: false
      - cron: "0 8 * * 6"
        timezone: "Asia/Jakarta"
        active: false

  # Test run (5 stocks only)
  - name: test-run
    entrypoint: flows/daily_collection_flow.py:daily_collection_flow
    description: "Test run — 5 stocks only for validation"
    work_pool:
      name: default-agent-pool
    parameters:
      stocks_file: config/syariah_stocks.txt
      collect_price: true
      collect_actions: true
      intraday_days: 30
      skip_intraday: true
      skip_validation: true
      update_mode: false
      skip_duplicate_check: true
      limit: 5
    schedules: []  # manual only

  # Copy latest backup from container to host filesystem (runs on HOST worker, not in Docker)
  - name: backup-copy
    entrypoint: flows/backup_copy_flow.py:backup_copy_flow
    description: "Copy latest QuestDB backup from container /backup/ to host backups/ folder"
    work_pool:
      name: host-pool
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /home/djp/eodhd_collector_optimized
    parameters:
      latest_only: true
    schedules: []  # manual only — trigger from UI after running questdb-backup

  # Weekly data quality check — OHLC validation, metadata cleanup, new symbols, partition monitor
  - name: data-quality
    entrypoint: flows/data_quality_flow.py:data_quality_flow
    description: "Weekly data quality: OHLC anomalies, metadata dedup, new symbol detection, partition sizing"
    work_pool:
      name: default-agent-pool
    parameters:
      stocks_file: config/syariah_stocks.txt
      lookback_days: 7
      spike_threshold: 0.5
      warn_partition_mb: 200
      run_cleanup: true
      run_ohlc: true
      run_symbols: true
      run_partitions: true
    schedules:
      # DISABLED 2026-07-28: this flow audits eodhd_stock_data (TABLE_STOCK_DATA in
      # db_config), which is the retired legacy table. stock_data is now covered by
      # nightly-data-check. Left defined but inactive rather than deleted.
      - cron: "30 8 * * 6"   # Saturday 08:30 WIB — AFTER gap-check (08:00) fills the week's gaps
        timezone: "Asia/Jakarta"
        active: false

  # Weekly yfinance fundamentals sweep — financial statements, profiles, analyst estimates.
  # Heaviest yfinance job (~9 requests/symbol), so it runs once a week and AFTER the
  # Saturday price jobs (gap-check 08:00, data-quality 08:30) rather than alongside them.
  - name: fundamentals-sweep
    entrypoint: flows/fundamentals_flow.py:fundamentals_flow
    description: "Weekly yfinance fundamentals: statements, profiles, analyst estimates"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
      include_profiles: true
      include_analyst: true
    schedules:
      - cron: "0 10 * * 6"   # Saturday 10:00 WIB — after data-quality (08:30)
        timezone: "Asia/Jakarta"
        active: true

  # Daily valuation snapshot — 1 request/symbol. This is the table that ACCUMULATES
  # what yfinance discards: marketCap/PE/PBV are point-in-time and unrecoverable
  # once they change, so a missed day is a permanent hole.
  - name: valuation-snapshot
    entrypoint: flows/fundamentals_flow.py:valuation_flow
    description: "Daily yfinance valuation snapshot (marketCap, PE, PBV, ROE)"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
    schedules:
      - cron: "0 21 * * 1-5"   # Mon-Fri 21:00 WIB — after bulk-eod (20:30)
        timezone: "Asia/Jakarta"
        active: true

  # DISABLED 2026-07-27: folded into nightly-data-check, which runs the same census
  # AND checks completeness/freshness AND heals missing symbols in one nightly pass.
  # Running both would run the census twice and corrupt the day-over-day comparison.
  - name: data-audit
    entrypoint: flows/data_audit_flow.py:data_audit_flow
    description: "Daily read-only census (superseded by nightly-data-check)"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters: {}
    schedules:
      - cron: "20 20 * * *"
        timezone: "Asia/Jakarta"
        active: false

  # Nightly self-monitoring: quality census + completeness/freshness + targeted
  # heal, in one pass, every night. Runs at 22:30 WIB, after the 21:30 price update
  # finishes (~22:00), so it verifies the night's collection and fills any gap a
  # failed/partial run left. Fails loudly if quality regresses, data goes stale, or
  # a systemic gap persists — turning the migration watch from manual checking into
  # a pipeline that tells you when something is wrong.
  - name: nightly-data-check
    entrypoint: flows/nightly_check_flow.py:nightly_check_flow
    description: "Nightly quality + completeness check with targeted gap-heal"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
    schedules:
      - cron: "30 22 * * *"   # every night 22:30 WIB, after the price update
        timezone: "Asia/Jakarta"
        active: true

  # yfinance price backfill — one-off seed of the shadow table with all history
  # Yahoo offers (decades of d/w/m, ~700 days of 1h). Manual only: it takes ~40
  # minutes and never needs repeating, since update runs keep it current.
  - name: yfinance-price-backfill
    entrypoint: flows/yfinance_price_flow.py:backfill_flow
    description: "One-off: seed yf_stock_data with full yfinance history"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
      skip_intraday: false
    schedules: []  # manual only

  # Daily yfinance price update — writes to yf_stock_data (shadow), NOT the EODHD
  # table, so the two sources can be compared bar for bar during the parallel run.
  # Scheduled last in the evening chain (19:30 daily-update, 20:00 gap-check,
  # 20:30 bulk-eod, 21:00 valuation) because a 651-symbol sweep runs ~40 minutes.
  - name: yfinance-price-update
    entrypoint: flows/yfinance_price_flow.py:update_flow
    description: "Daily yfinance OHLCV into the shadow table (parallel-run phase)"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
      update_window: 7
      skip_intraday: false
    schedules:
      - cron: "30 21 * * 1-5"   # Mon-Fri 21:30 WIB — after valuation-snapshot (21:00)
        timezone: "Asia/Jakarta"
        active: true

  # Live intraday: batch-fetch 1h for all symbols and derive 4h, hourly through the
  # IDX session. One yf.download call pulls all 651 in ~19s (vs ~11 min per-symbol),
  # so hourly collection stays light enough not to trip the rate limit. 4h is
  # derived from the fetched 1h (no extra API calls) and completes at the 12:00 and
  # 16:00 WIB session boundaries. The current hour's bar is partial until the 21:30
  # end-of-day run finalises it.
  - name: intraday-live
    entrypoint: flows/intraday_flow.py:intraday_flow
    description: "Hourly batch 1h + derived 4h during the IDX session"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
    schedules:
      # :20 past each session hour 09-16 WIB (weekdays), ~15-20 min after each hour
      # closes so the completed bar is available, plus the current partial bar.
      - cron: "20 9-16 * * 1-5"
        timezone: "Asia/Jakarta"
        active: true

  # Weekly yfinance dividends/splits into corporate_actions. Separate from the
  # nightly price update because actions change rarely and yfinance returns the
  # whole history per call — collecting them every night would roughly double the
  # rate-limit exposure for no benefit. DEDUP makes each run idempotent.
  - name: yfinance-actions
    entrypoint: flows/yfinance_price_flow.py:actions_flow
    description: "Weekly yfinance dividends/splits into corporate_actions"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      stocks_file: config/syariah_stocks.txt
    schedules:
      - cron: "0 11 * * 6"   # Saturday 11:00 WIB — after fundamentals-sweep (10:00)
        timezone: "Asia/Jakarta"
        active: true

  # Bulk last-day EOD/dividends/splits for the WHOLE exchange (1 request = 100 calls each,
  # vs ~651 per-symbol). INACTIVE until the bulk endpoint + exchange code are verified
  # after quota reset (run scripts/test_bulk.py). Activate, then drop EOD/actions from
  # daily-update so the savings materialise.
  - name: bulk-eod
    entrypoint: flows/daily_collection_flow.py:bulk_eod_flow
    description: "Bulk last-day EOD/div/splits for whole exchange (100 calls vs per-symbol)"
    work_pool:
      name: default-agent-pool
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      exchange: "JK"
      collect_eod: true
      collect_actions: true
    schedules:
      # DISABLED 2026-07-24: cutover to yfinance. bulk-eod pulls the whole JK
      # exchange from EODHD into eodhd_stock_data (legacy).
      - cron: "30 20 * * 1-5"   # Mon-Fri 20:30 WIB — after close + after gap-check (20:00)
        timezone: "Asia/Jakarta"
        active: false
