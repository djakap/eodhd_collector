# Project name is pinned here so the stack no longer depends on the folder name.
# It used to: the folder was `eodhd_collector_optimized`, Compose derived the volume
# names from it, and every invocation needed `-p eodhd_collector_optimized` or Docker
# would silently attach empty volumes. The volumes below are now named explicitly
# (see the note there), so this name is free to change without touching any data.
name: eodhd_collector

services:
  # -----------------------------------------------------------------------
  # QuestDB — time-series database
  # -----------------------------------------------------------------------
  questdb:
    image: questdb/questdb:7.3.10
    container_name: questdb
    restart: unless-stopped
    ports:
      - "8812:8812"   # PostgreSQL wire protocol
      - "9001:9000"   # Web console
      - "9009:9009"   # ILP (InfluxDB Line Protocol)
    environment:
      - QDB_CAIRO_MAX_UNCOMMITTED_ROWS=10000
      - QDB_PG_CONNECTION_POOL_CAPACITY=10
      - QDB_WAL_APPLY_WORKER_COUNT=1
      - QDB_SHARED_WORKER_COUNT=2
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------------------
  # Prefect Server — orchestration UI + API (localhost:4200)
  # -----------------------------------------------------------------------
  prefect-server:
    # Pinned instead of the rolling :3-latest tag: a background `docker compose
    # pull` must not silently swap the Prefect version out from under this
    # pipeline. Kept == the worker's client version (requirements-prefect.txt,
    # pinned to match) so the server never trails the client.
    # Do NOT bump to 3.7.x: tested 3.7.8 on 2026-07-29 and it throws persistent
    # SQLite "database is locked" errors on the worker-poll `UPDATE deployment
    # SET last_polled` writes (a row-lock pattern that doesn't fit SQLite's
    # whole-db lock); 3.6.18 has none. A 3.7.x move would need a Postgres backend
    # first. `prefect server start` runs the webserver AND the in-process loop
    # services (scheduler, late-runs, ...) — do NOT add --no-services, that turns
    # the scheduler off.
    image: prefecthq/prefect:3.6.18-python3.12
    container_name: prefect-server
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_UI_API_URL=http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:4200/api/health').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------------------
  # Prefect Worker — runs the collection flows
  # -----------------------------------------------------------------------
  prefect-worker:
    build: .
    container_name: prefect-worker
    restart: unless-stopped
    depends_on:
      questdb:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    environment:
      # Prefect
      - PREFECT_API_URL=http://prefect-server:4200/api
      # EODHD API
      - EODHD_API_KEY=${EODHD_API_KEY}
      - EODHD_PLAN=${EODHD_PLAN:-all_world_extended}
      # QuestDB — use Docker service name, not localhost
      - QUESTDB_HOST=questdb
      - QUESTDB_HTTP_PORT=9000
      - QUESTDB_PG_PORT=8812
      - QUESTDB_INFLUX_PORT=9009
      - QUESTDB_USER=admin
      - QUESTDB_PASSWORD=quest
      - QUESTDB_DATABASE=qdb
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=logs/eodhd_collector.log
    command: >
      bash -c "
        echo 'Waiting for Prefect server...' &&
        sleep 5 &&
        echo 'Creating work pool...' &&
        prefect work-pool create default-agent-pool --type process 2>/dev/null || true &&
        echo 'Deploying flows...' &&
        prefect deploy --all &&
        echo 'Clearing orphaned runs (free stuck concurrency slots)...' &&
        python scripts/clear_orphan_runs.py || true &&
        echo 'Healing suspended WAL tables (recover from corrupt segments)...' &&
        python scripts/heal_suspended_wal.py || true &&
        echo 'Starting worker...' &&
        prefect worker start --pool default-agent-pool
      "
    volumes:
      - worker_logs:/app/logs
      - questdb_data:/questdb-data:ro
      - ./backups:/backup
      # Code (flows/, collectors/, prefect.yaml) is BAKED into the image via the Dockerfile
      # COPY steps — deliberately NOT bind-mounted. Single-file bind mounts (esp.
      # prefect.yaml) broke on WSL2/Docker restart ("mount directory onto file"), which
      # crashed the worker on boot (exit 127) and left every deployment "Not Ready".
      # To change flow code or schedules now: `docker compose build prefect-worker && docker compose up -d prefect-worker`.

volumes:
  # Every volume is named EXPLICITLY and marked external. Compose otherwise prefixes
  # the project name onto a volume's name, which tied this stack's data to the folder
  # it happened to live in: renaming the folder pointed Prefect at a brand-new empty
  # volume and the entire run history looked lost. The `eodhd_collector_optimized_`
  # prefix below is the ORIGINAL folder's name, kept because it is what the existing
  # volumes are actually called on disk — it is an inert label now, not a dependency.
  # `external: true` also makes a missing volume fail loudly instead of being recreated
  # empty and quietly losing history.
  questdb_data:
    name: quest-db_questdb_data
    external: true
  prefect_data:
    name: eodhd_collector_optimized_prefect_data
    external: true
  worker_logs:
    name: eodhd_collector_optimized_worker_logs
    external: true
